# ===================================================================
# Smart Internship Tracker — Spring Boot Configuration
# Default Database: Embedded H2
# To use MySQL, activate the mysql profile
# ===================================================================

# --- 1. Server Configuration ---
server.port=${PORT:8080}
server.servlet.context-path=/

# --- 2. Database Configuration (Default: Embedded H2) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:internship_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- 3. JPA / Hibernate Configuration ---
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- 4. H2 Console (Local development only) ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- 5. JWT Security ---
# Set JWT_SECRET using an environment variable.
# Do not commit your actual secret to GitHub.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- 6. Initial Admin Account ---
# Supply these values through environment variables.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Placement Administrator}

# --- 7. CORS Allowed Origins ---
# Override this when deploying the frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- 8. Logging ---
logging.level.com.smartinternship.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO